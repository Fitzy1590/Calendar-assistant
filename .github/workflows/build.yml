name: build

# Every push: checks, Windows installer and Android APK as downloadable build artifacts.
# A release: push a version tag (v1.2.3), push a branch named release/v1.2.3, or run this workflow from the
# Actions tab with a version number.
# Both build everything stamped with that version and publish a GitHub Release.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Publish a release with this version (e.g. 0.2.0). Leave empty for a plain build."
        required: false
        default: ""

env:
  IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v') || inputs.release_version != '' }}
  # "v1.2.3", "release/v1.2.3" or "1.2.3"; scripts take the part after the last "/" and drop the "v"
  VERSION: ${{ inputs.release_version || ((startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v')) && github.ref_name) || '' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx prettier --check "src/**/*.{ts,tsx}"
      - run: npx vitest run
      - run: npx vite build
      - run: node --check server/sync-server.mjs

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Stamp the version from the tag
        if: env.IS_RELEASE == 'true'
        shell: bash
        run: V="${VERSION##*/}"; node scripts/set-version.mjs "${V#v}"
      - name: Turn on signed in-app updates (release builds with an updater key)
        if: env.IS_RELEASE == 'true'
        shell: bash
        env:
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node scripts/enable-updater.mjs
      - run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Name the installers without spaces (GitHub renames spaces in release files)
        shell: bash
        run: |
          mkdir -p out
          for f in src-tauri/target/release/bundle/nsis/*.exe* src-tauri/target/release/bundle/msi/*.msi*; do
            [ -e "$f" ] || continue
            cp "$f" "out/$(basename "$f" | tr ' ' '-')"
          done
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: out/*

  android:
    needs: check
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      # the runner image ships the Android SDK (ANDROID_HOME); add only the NDK and build tools we use
      - name: Install the Android NDK and build tools
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -n1)/sdkmanager
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;${NDK_VERSION}" "build-tools;34.0.0" "platforms;android-34" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          ls "$ANDROID_HOME/ndk"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - run: npm ci
      - name: Stamp the version from the tag
        if: env.IS_RELEASE == 'true'
        run: V="${VERSION##*/}"; node scripts/set-version.mjs "${V#v}"
      - name: Generate the Android project
        run: npx tauri android init --ci
      - name: Microphone, location and phone permissions
        run: node scripts/android-permissions.mjs
      - name: Build the APK
        run: npx tauri android build --apk --target aarch64 --target armv7
      - name: Sign the APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/34.0.0"
          UNSIGNED=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -n1)
          echo "Built: $UNSIGNED"
          mkdir -p out
          "$BT/zipalign" -f -p 4 "$UNSIGNED" out/aligned.apk
          if [ -n "${KEYSTORE_B64:-}" ]; then
            # your own release key (see docs/RELEASING.md): phones can update from one version to the next
            echo "$KEYSTORE_B64" | base64 -d > release.jks
            "$BT/apksigner" sign --ks release.jks --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" \
              --out out/CalendarAssistant.apk out/aligned.apk
            rm release.jks
          else
            # no release key yet: sign with a throwaway test key so the APK still installs
            keytool -genkeypair -keystore test.jks -storepass android -keypass android -alias test \
              -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Calendar Assistant test build"
            "$BT/apksigner" sign --ks test.jks --ks-pass pass:android --ks-key-alias test \
              --out out/CalendarAssistant-test-signed.apk out/aligned.apk
          fi
          rm out/aligned.apk
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: out/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v') || inputs.release_version != ''
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist-release, merge-multiple: true }
      - name: Update manifest for the in-app updater
        env:
          NOTES_FILE: docs/release-notes.md
        run: V="${VERSION##*/}"; node scripts/latest-json.mjs dist-release "v${V#v}"
      - run: ls -la dist-release
      - name: Release tag
        id: tag
        run: V="${VERSION##*/}"; echo "tag=v${V#v}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Calendar Assistant ${{ steps.tag.outputs.tag }}
          body_path: docs/release-notes.md
          generate_release_notes: true
          files: dist-release/*
