[package]
name = "calendar-assistant"
version = "0.1.0"
description = "Planner, calendar, tasks, contacts, weather, news and sports with a voice assistant"
edition = "2021"

[lib]
name = "calendar_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
