[package]
name = "calendar-assistant"
version = "0.1.0"
description = "Planner, calendar, tasks, contacts, weather, news and sports with a voice assistant"
edition = "2021"

[lib]
name = "calendar_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-http = "2"
tauri-plugin-oauth = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# desktop-only: in-app updates and relaunch
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Windows: native message box for the crash / "can't start" dialog
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
keyring = { version = "3", features = ["windows-native"] }
# browser mode (no WebView2): a tiny local web server with the app's pages built in
tiny_http = "0.12"
include_dir = "0.7"
